name: Import RC Hub archive

on:
  push:
    branches:
      - import/rc-hub-current
    paths:
      - .import/READY

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace repository tree with uploaded RC Hub archive
        shell: bash
        run: |
          set -euo pipefail
          cat .import/chunk-* > /tmp/rc-hub.zip.b64
          base64 --decode /tmp/rc-hub.zip.b64 > /tmp/rc-hub.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -q /tmp/rc-hub.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete RC Hub project"
          git push origin HEAD:import/rc-hub-current
