name: Import current RC Hub

on:
  push:
    branches:
      - codex/import-current-chat

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[skip import]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/import-current-chat
          fetch-depth: 0
      - name: Decode and integrate uploaded snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f .import/rc-hub-current.b64
          base64 -d .import/rc-hub-current.b64 > /tmp/rc-hub-current.zip
          rm -rf /tmp/rc-hub-current
          mkdir -p /tmp/rc-hub-current
          unzip -q /tmp/rc-hub-current.zip -d /tmp/rc-hub-current

          mkdir -p apps/cockpit/scripts
          cp -a /tmp/rc-hub-current/.openai apps/cockpit/
          cp -a /tmp/rc-hub-current/app apps/cockpit/
          cp -a /tmp/rc-hub-current/db apps/cockpit/
          cp -a /tmp/rc-hub-current/server apps/cockpit/
          cp -a /tmp/rc-hub-current/src apps/cockpit/
          cp /tmp/rc-hub-current/next-env.d.ts apps/cockpit/
          cp /tmp/rc-hub-current/next.config.mjs apps/cockpit/
          cp /tmp/rc-hub-current/package.json apps/cockpit/
          cp /tmp/rc-hub-current/package-lock.json apps/cockpit/
          cp /tmp/rc-hub-current/scripts/build.mjs apps/cockpit/scripts/
          cp /tmp/rc-hub-current/scripts/prepare-dist.mjs apps/cockpit/scripts/

          cp -a /tmp/rc-hub-current/nginx ./nginx
          cp -a /tmp/rc-hub-current/deploy ./deploy
          mkdir -p scripts
          cp /tmp/rc-hub-current/scripts/home-backup.sh scripts/
          cp /tmp/rc-hub-current/scripts/home-update.sh scripts/
          cp /tmp/rc-hub-current/docker-compose.yml ./docker-compose.yml
          cp /tmp/rc-hub-current/HOME_SERVER.md ./HOME_SERVER.md

          cat > Dockerfile <<'EOF'
          FROM node:22-alpine
          WORKDIR /app
          COPY apps/cockpit/package.json apps/cockpit/package-lock.json ./
          COPY apps/cockpit/ ./
          RUN npm run build
          ENV PORT=3000 RC_HUB_DATA_DIR=/data
          VOLUME ["/data"]
          EXPOSE 3000
          CMD ["npm", "start"]
          EOF

          cat > .env.home.example <<'EOF'
          # RC Hub Homeserver
          RC_HUB_BASIC_USER=rc-hub
          RC_HUB_BASIC_PASSWORD=CHANGE_ME
          RC_HUB_HTTP_PORT=8080
          RC_HUB_BACKUP_KEEP_DAYS=30
          EOF

          python3 - <<'PY'
          from pathlib import Path
          path = Path('HOME_SERVER.md')
          text = path.read_text()
          note = "Der aktuelle Cockpit-Anwendungsstand liegt im Monorepo unter `apps/cockpit/`. Docker baut diese App über den Root-`Dockerfile`; bestehende Monorepo-Pakete bleiben davon getrennt.\n\n"
          if note not in text:
              text = text.replace('# RC Hub auf dem Home-Server testen\n\n', '# RC Hub auf dem Home-Server testen\n\n' + note, 1)
          path.write_text(text)
          PY

          cat >> .gitignore <<'EOF'

          # RC Hub homeserver runtime
          data/
          backups/
          EOF
          chmod +x nginx/entrypoint.sh scripts/home-backup.sh scripts/home-update.sh

      - name: Build and checks
        shell: bash
        run: |
          set -euo pipefail
          cd apps/cockpit
          npm run build
          npm test --if-present
          node --check server/home-server.mjs
          node --check scripts/build.mjs
          node --check scripts/prepare-dist.mjs
          cd ../..
          sh -n scripts/home-backup.sh
          sh -n scripts/home-update.sh
          sh -n nginx/entrypoint.sh
          rm -rf apps/cockpit/dist

      - name: Commit imported snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile HOME_SERVER.md .env.home.example .gitignore docker-compose.yml nginx deploy scripts apps/cockpit
          git commit -m "feat: import current RC Hub cockpit and homeserver stack [skip import]"
          git push origin HEAD:codex/import-current-chat
